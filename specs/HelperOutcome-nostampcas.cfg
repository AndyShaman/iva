\* Повторная квитанция T16 без сверки wake.sent нарушает WakesCountedOnce.
\* Основная модель: две строки одного чата; Init исследует обе готовыми одновременно;
\* policy исследует и «Очередь», и «Перебивать». Один из всех классов отказа на трассу.
CONSTANTS
  V6Case = "legacy"
  V6Mutant = "none"
  N = 2
  EscalateWakes = 1
  MaxFailures = 1
  MaxWake = 5
  MaxOwnerMessages = 1
  MaxNews = 1
  MaxTurns = 6
  RecordClosed = FALSE
  StampCAS = FALSE
  RespectBusy = TRUE
  UniqueWakeIds = TRUE
  RequireShown = TRUE
  KeepUndelivered = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK WakesCountedOnce DeliveredOnlyAfterShownAndOutbox OneDeliveredPerTurn ClosedHasNoDelivery NoWakeWhileBusy WakeIdUnique DupOnlyWithoutDurableMark UndeliveredKept
