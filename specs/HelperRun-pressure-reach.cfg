\* Must reach three remote turns with an unrecorded tail.
\* Основная модель: три строки готовы одновременно, два server-процесса, MaxRunning=2.
CONSTANTS
  Helpers = {h1, h2, h3}
  Servers = {s1, s2}
  MaxRunning = 2
  DeadlineTicks = 1
  MaxClaims = 3
  MaxSteps = 1
  FinalizeCAS = TRUE
  ReapOrphans = TRUE
  OwnerClaimSafe = TRUE
  EnforceLimit = TRUE
  WaitClientEnd = TRUE
  WaitForEnd = TRUE
INIT Init
NEXT PressureNext
INVARIANTS TypeOK OneRun WithinLimits OutcomeOnce StopOnce ClosedFinal SlotFreedAfterEnd NoThreeRemoteTurns
