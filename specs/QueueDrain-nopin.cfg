  Loop = "any"
  Late = TRUE
  Pin = FALSE
  SameSender = TRUE
  FreshAck = TRUE
  AloneRule = TRUE
  QueueFirst = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoDupBeyondBreak
