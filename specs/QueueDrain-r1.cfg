\* Починка R1 (QueueFirst): пока очередь чата не пуста, сообщение встаёт за ней и при
\* «Перебивать». Та же среда, что у QueueDrain-switch.cfg. Ожидание: ошибок нет.
CONSTANTS
  N = 3
  MaxItems = 2
  MaxRestarts = 1
  MaxLedgerLoss = 0
  MaxSwitches = 2
  Policy = "steer"
  Loop = "seq"
  Late = TRUE
  Pin = TRUE
  SameSender = TRUE
  FreshAck = TRUE
  AloneRule = TRUE
  QueueFirst = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoLoss NoDupBeyondBreak QueueOrder WholeBatch AloneStaysAlone BatchAtHead PinAtHead
