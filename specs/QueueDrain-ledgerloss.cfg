\* Находка (рецензия спеки v1, п. 1): ledger eve теряет id (ошибка записи после принятия или
\* вытеснение из последних 200). Закреплённая пачка, принятая после срока Bridge, уходит снова и
\* даёт второй ход без перезапуска. Ожидание: NoDupBeyondBreak.
CONSTANTS
  N = 3
  MaxItems = 2
  MaxRestarts = 1
  MaxLedgerLoss = 1
  MaxSwitches = 0
  Policy = "queue"
  Loop = "any"
  Late = TRUE
  Pin = TRUE
  SameSender = TRUE
  FreshAck = TRUE
  AloneRule = TRUE
  QueueFirst = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoLoss NoDupBeyondBreak QueueOrder WholeBatch AloneStaysAlone BatchAtHead PinAtHead
