\* Основная модель: выборы, при которых держатся все инварианты и живучесть. Где спека v3 молчит
\* или задаёт иначе, выбор помечен в шапке LaunchdUnit.tla; свидетели ниже. Ожидание: ошибок нет.
CONSTANTS
  MaxSteps = 4
  StopKAMode = "bootout"
  StopOneshotMode = "kill"
  StopTimerMode = "bootout"
  KillUnloadedOk = TRUE
  ActiveByLoaded = FALSE
  ThrottledAnswer = "activating"
  RestartKMode = "reload"
  RestartTimerMode = "reload"
  KeepAlive = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoSelfStart ActiveOnlyRunning RestoreExact CalendarKept QuiesceStops KeepAliveSurvivesUpdate RestartLoadsPlist TimerVerbNoRun
PROPERTY CrashRecovers
