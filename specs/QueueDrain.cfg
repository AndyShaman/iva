\* Код (все переключатели кода TRUE): «Очередь», два автора, маршрут между любыми шагами слива
\* (Loop = "any", шире кода), доставка может быть принята после срока Bridge, один перезапуск,
\* ledger не теряет id. 3 сообщения, граница пачки 2. Ожидание: ошибок нет.
CONSTANTS
  N = 3
  MaxItems = 2
  MaxRestarts = 1
  MaxLedgerLoss = 0
  MaxSwitches = 0
  Policy = "queue"
  Loop = "any"
  Late = TRUE
  Pin = TRUE
  SameSender = TRUE
  FreshAck = TRUE
  AloneRule = TRUE
  QueueFirst = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoLoss NoDupBeyondBreak QueueOrder WholeBatch AloneStaysAlone BatchAtHead PinAtHead
