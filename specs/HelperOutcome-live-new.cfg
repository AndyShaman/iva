\* Temporal properties only; HelperOutcome.cfg checks all invariants.
\* Liveness: /new and every failure class; owner interruption checked separately.
\* Основная модель: две строки одного чата; Init исследует обе готовыми одновременно;
\* policy исследует и «Очередь», и «Перебивать». Один из всех классов отказа на трассу.
CONSTANTS
  N = 2
  EscalateWakes = 1
  MaxFailures = 1
  MaxWake = 5
  MaxOwnerMessages = 0
  MaxNews = 1
  MaxTurns = 5
  RecordClosed = FALSE
  StampCAS = TRUE
  RespectBusy = TRUE
  UniqueWakeIds = TRUE
  RequireShown = TRUE
  KeepUndelivered = TRUE
SPECIFICATION Spec
VIEW LiveView
PROPERTY EventuallyDelivered
