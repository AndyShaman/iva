\* Temporal properties only; HelperOutcome.cfg checks all invariants.
\* Liveness: owner queue/steer and every failure class; /new checked separately.
\* Основная модель: две строки одного чата; Init исследует обе готовыми одновременно;
\* policy исследует и «Очередь», и «Перебивать». Один из всех классов отказа на трассу.
CONSTANTS
  V6Case = "legacy"
  V6Mutant = "none"
  N = 2
  EscalateWakes = 1
  MaxFailures = 1
  MaxWake = 5
  MaxOwnerMessages = 1
  MaxNews = 0
  MaxTurns = 6
  RecordClosed = FALSE
  StampCAS = TRUE
  RespectBusy = TRUE
  UniqueWakeIds = TRUE
  RequireShown = TRUE
  KeepUndelivered = TRUE
SPECIFICATION Spec
VIEW LiveView
PROPERTY EventuallyDelivered
