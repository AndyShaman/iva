\* Находка: спека v3 — restart загруженного = kickstart -k, daemon-reload = ничего.
\* ОБЯЗАН нарушать RestartLoadsPlist: плист переписан (TZ, окружение), restart вернул 0, launchd
\* работает по копии с прошлого bootstrap.
CONSTANTS
  MaxSteps = 4
  StopKAMode = "bootout"
  StopOneshotMode = "kill"
  StopTimerMode = "bootout"
  KillUnloadedOk = TRUE
  ActiveByLoaded = FALSE
  ThrottledAnswer = "activating"
  RestartKMode = "kickstartK"
  RestartTimerMode = "reload"
  KeepAlive = TRUE
  WaitStop = TRUE
  WaitRestart = TRUE
SPECIFICATION Spec
INVARIANTS TypeOK NoSelfStart ActiveOnlyRunning RestoreExact CalendarKept QuiesceStops KeepAliveSurvivesUpdate RestartLoadsPlist TimerVerbNoRun RestartWorks WritersStopped
