\* Liveness: two competing helpers; both T3 writers, restart and remote tails retained.
\* Основная модель: два помощника готовы одновременно, два server-процесса, MaxRunning=1.
CONSTANTS
  Helpers = {h1, h2}
  Servers = {s1, s2}
  MaxRunning = 1
  DeadlineTicks = 1
  MaxClaims = 2
  MaxSteps = 1
  FinalizeCAS = TRUE
  ReapOrphans = TRUE
  OwnerClaimSafe = TRUE
  EnforceLimit = TRUE
  WaitClientEnd = TRUE
  WaitForEnd = TRUE
SPECIFICATION Spec
VIEW View
INVARIANTS TypeOK OneRun WithinLimits OutcomeOnce StopOnce ClosedFinal SlotFreedAfterEnd
PROPERTIES NoSilentEnd UnrecordedTailEnds
