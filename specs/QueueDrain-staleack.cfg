\* Свидетель: снятие пишет снимок, прочитанный в начале прохода, без id пачки (FreshAck = FALSE,
\* атомарность снятия сломана): сообщение, вставшее в очередь между снимком и снятием, пропадает.
\* Ожидание: NoLoss.
CONSTANTS
  N = 3
  MaxItems = 2
  MaxRestarts = 1
  MaxLedgerLoss = 0
  MaxSwitches = 0
  Policy = "queue"
  Loop = "any"
  Late = TRUE
  Pin = TRUE
  SameSender = TRUE
  FreshAck = FALSE
  AloneRule = TRUE
  QueueFirst = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoLoss
