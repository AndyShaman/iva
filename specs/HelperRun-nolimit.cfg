\* Свидетель: T2 не считает занятые durable slots. ОБЯЗАН первым нарушить WithinLimits.
CONSTANTS
  V6Case = "legacy"
  V6Mutant = "none"
  Helpers = {h1, h2, h3}
  Servers = {s1, s2}
  MaxRunning = 2
  DeadlineTicks = 1
  MaxClaims = 3
  MaxSteps = 1
  FinalizeCAS = TRUE
  ReapOrphans = TRUE
  OwnerClaimSafe = TRUE
  EnforceLimit = FALSE
  WaitClientEnd = TRUE
  WaitForEnd = TRUE
SPECIFICATION Spec
VIEW FullView
INVARIANTS TypeOK WithinLimits OneRun OutcomeOnce StopOnce ClosedFinal SlotFreedAfterEnd
