\* Находка F1 в порядке кода (Loop = "seq"): режим «Перебивать», владелец дважды переключает его
\* (как в живой проверке на c1: «Очередь» на время проверки и обратно), один перезапуск. Прямая
\* доставка обгоняет очередь, её id попадает в ledger, пачка с этим id получает handled, и
\* стоящее перед ним сообщение пропадает. Ожидание: NoLoss.
CONSTANTS
  N = 3
  MaxItems = 2
  MaxRestarts = 1
  MaxLedgerLoss = 0
  MaxSwitches = 2
  Policy = "steer"
  Loop = "seq"
  Late = TRUE
  Pin = TRUE
  SameSender = TRUE
  FreshAck = TRUE
  AloneRule = TRUE
  QueueFirst = FALSE
SPECIFICATION Spec
INVARIANTS TypeOK NoLoss NoDupBeyondBreak QueueOrder WholeBatch AloneStaysAlone BatchAtHead PinAtHead
